spring:
  datasource:
    url: jdbc:mysql://${DB_URL}:3306/itcommunity?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # 운영에서는 구조 검증만 수행
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
