spring:
  datasource:
    url: jdbc:h2:mem:itcommunity;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create  # 서버 시작 시 테이블 자동 생성
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
